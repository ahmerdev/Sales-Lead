{% extends 'base/base.html' %}

{% block title %}Create Proposal for {{ lead.business_name }} — LeadRadar AI{% endblock %}

{% block content %}
<div class="w-full space-y-6">
    <div>
        <h1 class="text-2xl font-bold text-white tracking-tight">Draft Client Proposal</h1>
        <p class="text-xs text-slate-400 mt-1">Pre-populated from detected technical and conversion opportunities</p>
    </div>

    <div class="bg-slate-900/60 border border-slate-800/80 rounded-2xl p-6 backdrop-blur-xl">
        <form method="POST" class="space-y-5">
            {% csrf_token %}
            <div>
                <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1">Proposal Title</label>
                <input type="text" name="title" value="Website & Digital Growth Proposal for {{ lead.business_name }}" required class="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-2.5 text-xs text-white focus:outline-none focus:border-indigo-500">
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1">Scope of Work (Auto-Populated from Audit)</label>
                <textarea name="scope_summary" rows="6" required class="w-full bg-slate-950 border border-slate-800 rounded-lg p-3 text-xs text-white font-mono leading-relaxed focus:outline-none focus:border-indigo-500">{{ default_scope }}</textarea>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1">Estimated Timeline</label>
                    <input type="text" name="timeline" value="14–21 business days" required class="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-2.5 text-xs text-white focus:outline-none focus:border-indigo-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1">Total Investment</label>
                    <input type="number" step="0.01" name="investment_amount" value="750.00" required class="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-2.5 text-xs text-white focus:outline-none focus:border-indigo-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1">Currency</label>
                    <select name="currency" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-2.5 text-xs text-white focus:outline-none focus:border-indigo-500">
                        <option value="USD" selected>USD ($)</option>
                        <option value="AED">AED (AED)</option>
                        <option value="SAR">SAR (SAR)</option>
                        <option value="GBP">GBP (£)</option>
                        <option value="EUR">EUR (€)</option>
                        <option value="PKR">PKR (Rs)</option>
                    </select>
                </div>
            </div>

            <div class="pt-3 flex items-center justify-between">
                <a href="{% url 'leads:detail' pk=lead.id %}" class="text-xs text-slate-400 hover:text-white">&larr; Back to Lead</a>
                <button type="submit" class="px-5 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white font-semibold text-xs shadow-md shadow-emerald-600/30 transition">
                    Generate Digital Proposal
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
