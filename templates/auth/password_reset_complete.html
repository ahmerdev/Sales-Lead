{% extends 'base/base.html' %}
{% block title %}Password changed — LeadRadar AI{% endblock %}
{% block content %}
<div class="min-h-[70vh] flex items-center justify-center py-12 px-4">
    <div class="max-w-md w-full space-y-4 bg-slate-900/90 border border-slate-800 p-8 rounded-2xl shadow-2xl text-center">
        <h2 class="text-2xl font-bold text-white">Password changed</h2>
        <p class="text-sm text-slate-400">Your password has been updated. You can now sign in.</p>
        <a href="{% url 'login' %}" class="inline-block px-6 py-2.5 rounded-xl text-sm font-semibold text-white bg-indigo-600 hover:bg-indigo-500 transition">Sign in</a>
    </div>
</div>
{% endblock %}
